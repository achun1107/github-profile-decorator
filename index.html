<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub 个人主页装修助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎨</span>
      <div>
        <h1>GitHub 个人主页装修助手</h1>
        <p class="sub">勾选模块 → 实时预览 → 一键导出装饰版 README</p>
      </div>
    </div>
    <a class="star" href="https://github.com/achun1107/github-profile-decorator" target="_blank" rel="noopener">★ 仓库</a>
  </header>

  <main class="layout">
    <!-- 左侧控制面板 -->
    <section class="panel controls">
      <div class="field">
        <label>GitHub 用户名 <span class="req">*</span></label>
        <input id="username" type="text" placeholder="例如 achun1107" autocomplete="off" />
      </div>

      <div class="field">
        <label>显示昵称（可选）</label>
        <input id="displayName" type="text" placeholder="留空则用用户名" autocomplete="off" />
      </div>

      <div class="field">
        <label>自我介绍（支持多行）</label>
        <textarea id="bio" rows="3" placeholder="一名热爱开源的开发者…"></textarea>
      </div>

      <div class="field">
        <label>打字动画文案（每行一条）</label>
        <textarea id="typingLines" rows="3" placeholder="Hi, I'm a developer👋&#10;Love Open Source 🚀&#10;Building cool things"></textarea>
      </div>

      <div class="field">
        <label>统计卡片主题</label>
        <select id="theme">
          <option value="radical">radical</option>
          <option value="tokyonight">tokyonight</option>
          <option value="vue">vue</option>
          <option value="nightowl">nightowl</option>
          <option value="buefy">buefy</option>
          <option value="gruvbox">gruvbox</option>
          <option value="dracula">dracula</option>
          <option value="merko">merko</option>
        </select>
      </div>

      <div class="field">
        <label>技术栈图标（skill-icons，逗号分隔）</label>
        <input id="techIcons" type="text" value="js,ts,react,node,vscode,git,github,html,css,python" />
      </div>

      <div class="field">
        <label>社交链接（可选）</label>
        <div class="grid2">
          <input id="socialGithub" type="text" placeholder="GitHub 用户名" />
          <input id="socialEmail" type="text" placeholder="邮箱" />
          <input id="socialWebsite" type="text" placeholder="个人网站域名" />
          <input id="socialTwitter" type="text" placeholder="Twitter 用户名" />
        </div>
      </div>

      <div class="field">
        <label>页脚语录</label>
        <input id="quote" type="text" value="Code is poetry." />
      </div>

      <div class="field">
        <label>装修模块</label>
        <div class="toggles" id="toggles">
          <label class="tg"><input type="checkbox" data-key="showTyping" checked /><span>打字动画横幅</span></label>
          <label class="tg"><input type="checkbox" data-key="showVisitor" checked /><span>访客计数徽章</span></label>
          <label class="tg"><input type="checkbox" data-key="showTitle" checked /><span>标题 + 自我介绍</span></label>
          <label class="tg"><input type="checkbox" data-key="showStats" checked /><span>GitHub 统计卡片</span></label>
          <label class="tg"><input type="checkbox" data-key="showStreak" checked /><span>连续打卡 Streak</span></label>
          <label class="tg"><input type="checkbox" data-key="showTech" checked /><span>技术栈图标</span></label>
          <label class="tg"><input type="checkbox" data-key="showSnake" checked /><span>贡献蛇动画</span></label>
          <label class="tg"><input type="checkbox" data-key="showSocial" checked /><span>社交徽章</span></label>
          <label class="tg"><input type="checkbox" data-key="showQuote" checked /><span>页脚语录</span></label>
        </div>
      </div>
    </section>

    <!-- 右侧预览面板 -->
    <section class="panel preview">
      <div class="tabs">
        <button class="tab active" data-tab="render">效果预览</button>
        <button class="tab" data-tab="md">Markdown 源码</button>
        <div class="actions">
          <button id="copyBtn" class="btn">复制 README</button>
          <button id="dlMd" class="btn">下载 .md</button>
          <button id="dlSnake" class="btn ghost">下载 snake.yml</button>
        </div>
      </div>
      <div id="renderView" class="view render"></div>
      <pre id="mdView" class="view md" style="display:none"></pre>
    </section>
  </main>

  <footer class="foot">
    本地工具 · 不收集任何数据 · 所有卡片均调用公开的第三方徽章服务（github-readme-stats / skill-icons / streak-stats 等）
  </footer>

  <script src="app.js"></script>
</body>
</html>
